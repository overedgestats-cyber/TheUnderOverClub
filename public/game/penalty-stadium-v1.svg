<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" shape-rendering="crispEdges">
  <defs>
    <pattern id="crowd" width="24" height="28" patternUnits="userSpaceOnUse">
      <rect width="24" height="28" fill="#17212a"/>
      <rect x="3" y="3" width="5" height="5" fill="#d8784d"/>
      <rect x="4" y="8" width="4" height="7" fill="#31495b"/>
      <rect x="13" y="5" width="5" height="5" fill="#e0b84c"/>
      <rect x="14" y="10" width="4" height="7" fill="#5f415e"/>
      <rect x="8" y="20" width="4" height="4" fill="#7794a6"/>
      <rect x="19" y="19" width="3" height="4" fill="#d9c76e"/>
    </pattern>

    <pattern id="net" width="28" height="20" patternUnits="userSpaceOnUse">
      <rect width="28" height="20" fill="#0d2415" fill-opacity=".32"/>
      <path d="M0 0H28M0 20H28M0 0V20M28 0V20" stroke="#e5eee7" stroke-opacity=".58" stroke-width="2"/>
    </pattern>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#101921"/>
    </linearGradient>

    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b9a3b"/>
      <stop offset="1" stop-color="#2f792f"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="1200" height="650" fill="url(#sky)"/>
  <rect x="70" y="45" width="4" height="4" fill="#d8e2e8"/>
  <rect x="1040" y="56" width="4" height="4" fill="#d8e2e8"/>
  <rect x="890" y="30" width="3" height="3" fill="#7f919d"/>
  <rect x="290" y="27" width="3" height="3" fill="#7f919d"/>

  <!-- floodlights -->
  <g transform="translate(35 92) rotate(3)">
    <rect x="0" y="0" width="90" height="66" fill="#67757e"/>
    <rect x="7" y="7" width="76" height="52" fill="#253038"/>
    <g fill="#fff7c9">
      <rect x="12" y="12" width="13" height="10"/><rect x="30" y="12" width="13" height="10"/>
      <rect x="48" y="12" width="13" height="10"/><rect x="66" y="12" width="13" height="10"/>
      <rect x="12" y="27" width="13" height="10"/><rect x="30" y="27" width="13" height="10"/>
      <rect x="48" y="27" width="13" height="10"/><rect x="66" y="27" width="13" height="10"/>
      <rect x="12" y="42" width="13" height="10"/><rect x="30" y="42" width="13" height="10"/>
      <rect x="48" y="42" width="13" height="10"/><rect x="66" y="42" width="13" height="10"/>
    </g>
    <rect x="39" y="66" width="8" height="110" fill="#54616a"/>
  </g>

  <g transform="translate(1075 92) rotate(-3)">
    <rect x="0" y="0" width="90" height="66" fill="#67757e"/>
    <rect x="7" y="7" width="76" height="52" fill="#253038"/>
    <g fill="#fff7c9">
      <rect x="12" y="12" width="13" height="10"/><rect x="30" y="12" width="13" height="10"/>
      <rect x="48" y="12" width="13" height="10"/><rect x="66" y="12" width="13" height="10"/>
      <rect x="12" y="27" width="13" height="10"/><rect x="30" y="27" width="13" height="10"/>
      <rect x="48" y="27" width="13" height="10"/><rect x="66" y="27" width="13" height="10"/>
      <rect x="12" y="42" width="13" height="10"/><rect x="30" y="42" width="13" height="10"/>
      <rect x="48" y="42" width="13" height="10"/><rect x="66" y="42" width="13" height="10"/>
    </g>
    <rect x="39" y="66" width="8" height="110" fill="#54616a"/>
  </g>

  <!-- supporter banners -->
  <g>
    <rect x="240" y="55" width="330" height="58" fill="#a72820" stroke="#10161a" stroke-width="6"/>
    <rect x="246" y="61" width="318" height="46" fill="none" stroke="#e54a39" stroke-width="2"/>
    <text x="405" y="91" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="24" font-weight="900">
      STATS.GOALS.PROFIT.
    </text>

    <rect x="595" y="55" width="365" height="58" fill="#123f7d" stroke="#10161a" stroke-width="6"/>
    <rect x="601" y="61" width="353" height="46" fill="none" stroke="#2c66a4" stroke-width="2"/>
    <text x="778" y="91" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="23" font-weight="900">
      THE UNDER OVER CLUB
    </text>
  </g>

  <!-- crowd -->
  <rect x="0" y="150" width="1200" height="215" fill="url(#crowd)"/>
  <rect x="0" y="324" width="1200" height="41" fill="#10161a"/>
  <rect x="0" y="329" width="1200" height="5" fill="#3a454d"/>

  <!-- pitch-side boards -->
  <g font-family="monospace" font-weight="900" text-anchor="middle">
    <rect x="20" y="312" width="150" height="42" fill="#8d261f" stroke="#0f1418" stroke-width="4"/>
    <text x="95" y="339" fill="#ffffff" font-size="18">STATS.</text>
    <rect x="178" y="312" width="150" height="42" fill="#173e77" stroke="#0f1418" stroke-width="4"/>
    <text x="253" y="339" fill="#ffffff" font-size="18">GOALS.</text>
    <rect x="872" y="312" width="150" height="42" fill="#173e77" stroke="#0f1418" stroke-width="4"/>
    <text x="947" y="339" fill="#ffffff" font-size="18">PROFIT.</text>
    <rect x="1030" y="312" width="150" height="42" fill="#8d261f" stroke="#0f1418" stroke-width="4"/>
    <text x="1105" y="339" fill="#ffffff" font-size="15">FOOTBALL</text>
  </g>

  <!-- pitch -->
  <rect x="0" y="360" width="1200" height="290" fill="url(#pitch)"/>
  <g opacity=".15">
    <rect x="0" y="360" width="120" height="290" fill="#0f4f23"/>
    <rect x="240" y="360" width="120" height="290" fill="#0f4f23"/>
    <rect x="480" y="360" width="120" height="290" fill="#0f4f23"/>
    <rect x="720" y="360" width="120" height="290" fill="#0f4f23"/>
    <rect x="960" y="360" width="120" height="290" fill="#0f4f23"/>
  </g>

  <!-- perspective pitch markings -->
  <path d="M90 650L340 455M1110 650L860 455" fill="none" stroke="#f6f5e9" stroke-opacity=".88" stroke-width="5"/>
  <path d="M200 650H1000" fill="none" stroke="#f6f5e9" stroke-opacity=".82" stroke-width="5"/>
  <path d="M260 650L380 500H820L940 650" fill="none" stroke="#f6f5e9" stroke-opacity=".78" stroke-width="4"/>
  <ellipse cx="600" cy="547" rx="6" ry="3" fill="#f7f6eb"/>

  <!-- goal -->
  <g>
    <rect x="280" y="250" width="640" height="220" fill="url(#net)" stroke="#f7f6ed" stroke-width="12"/>
    <path d="M280 470L265 492M920 470L935 492" stroke="#f7f6ed" stroke-width="10"/>
    <rect x="292" y="262" width="616" height="196" fill="none" stroke="#8e928b" stroke-width="2" opacity=".65"/>
  </g>
</svg>
